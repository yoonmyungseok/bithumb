<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일일 퀀트 보고서 • AI 퀀트 트레이딩 Pro</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked Markdown Parser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="p-3 sm:p-6 min-h-screen bg-[#0b0e14] text-slate-100">
  <div class="max-w-7xl mx-auto space-y-4 sm:space-y-6">

    <!-- Top Navigation Header -->
    <header class="flex flex-wrap justify-between items-center bg-slate-900/90 p-4 sm:p-5 rounded-2xl border border-slate-800 backdrop-blur shadow-2xl gap-3">
      <div class="flex items-center space-x-3 sm:space-x-4">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-indigo-600 via-blue-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-xl sm:text-2xl shrink-0">
          📑
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-lg sm:text-2xl font-black bg-gradient-to-r from-blue-400 via-indigo-200 to-emerald-400 bg-clip-text text-transparent">
              일일 퀀트 성과 분석 보고서
            </h1>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Daily Report</span>
          </div>
          <div class="flex items-center mt-0.5 sm:mt-1 text-xs text-slate-400">
            <span>24시간 롤링 퀀트 성과, 시장 거시 인텔리전스 및 매매 복기</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="/" class="px-3.5 py-2 min-h-[38px] bg-slate-800 hover:bg-slate-700 font-bold rounded-xl text-xs sm:text-sm text-slate-200 hover:text-white shadow-lg transition active:scale-95 flex items-center justify-center gap-1.5 border border-slate-700">
          <span>📊</span>
          <span>실시간 대시보드로 이동</span>
        </a>
      </div>
    </header>

    <!-- Report Top Control & Date Navigator Bar -->
    <div class="card-glass p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2 sm:gap-3">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-semibold text-slate-400">📅 분석 기준일:</span>
          <select id="report-date-select" onchange="onReportDateChange(this.value)" class="bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-semibold focus:outline-none focus:border-indigo-500 cursor-pointer">
            <option value="">보고서 목록 불러오는 중...</option>
          </select>
        </div>
        <div class="flex items-center gap-1">
          <button id="report-prev-btn" onclick="navigateReport(-1)" title="이전 날짜 보고서" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700 transition">
            ◀ 이전
          </button>
          <button id="report-next-btn" onclick="navigateReport(1)" title="다음 날짜 보고서" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700 transition">
            다음 ▶
          </button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button onclick="refreshCurrentReport()" title="보고서 새로고침" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition inline-flex items-center gap-1">
          <span>🔄</span>
          <span class="hidden sm:inline">새로고침</span>
        </button>
        <button onclick="copyReportMarkdown()" title="마크다운 원문 복사" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition inline-flex items-center gap-1">
          <span>📋</span>
          <span class="hidden sm:inline">MD 복사</span>
        </button>
        <button onclick="downloadReportMarkdown()" title="보고서 파일 다운로드" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition inline-flex items-center gap-1 shadow-sm">
          <span>⬇</span>
          <span>다운로드</span>
        </button>
      </div>
    </div>

    <!-- Report Metadata Header Card -->
    <div id="report-meta-card" class="card-glass p-4 sm:p-5">
      <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800/80 pb-3 mb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl">📑</span>
          <h2 id="report-header-title" class="text-base sm:text-lg font-bold text-white">
            암호화폐 퀀트 매매 성과 분석 보고서
          </h2>
        </div>
        <span id="report-badge-status" class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
          정상 로드
        </span>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs text-slate-400">
        <div class="bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">
          <div class="text-slate-500 mb-0.5">분석 기준일</div>
          <div id="report-meta-date" class="font-bold text-slate-200">-</div>
        </div>
        <div class="bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">
          <div class="text-slate-500 mb-0.5">파일명</div>
          <div id="report-meta-filename" class="font-bold text-slate-200 truncate">-</div>
        </div>
        <div class="bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">
          <div class="text-slate-500 mb-0.5">보고서 용량</div>
          <div id="report-meta-size" class="font-bold text-slate-200">-</div>
        </div>
        <div class="bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/60">
          <div class="text-slate-500 mb-0.5">최종 갱신 시각</div>
          <div id="report-meta-mtime" class="font-bold text-slate-200">-</div>
        </div>
      </div>
    </div>

    <!-- Report Content Card -->
    <div class="card-glass p-5 sm:p-8 min-h-[500px]">
      <!-- Loading State Indicator -->
      <div id="report-loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
        <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
        <p class="text-sm font-semibold text-slate-300">일일 퀀트 보고서를 불러오는 중입니다...</p>
        <p class="text-xs text-slate-500 mt-1">서버에서 마크다운 데이터를 안전하게 가져오고 있습니다.</p>
      </div>

      <!-- Error State Indicator -->
      <div id="report-error" class="hidden flex flex-col items-center justify-center py-20 text-center">
        <div class="text-4xl mb-3">⚠️</div>
        <h3 class="text-base font-bold text-rose-400 mb-1">보고서를 불러오지 못했습니다</h3>
        <p id="report-error-msg" class="text-xs text-slate-400 mb-4">해당 날짜의 보고서가 아직 생성되지 않았거나 파일을 읽을 수 없습니다.</p>
        <button onclick="refreshCurrentReport()" class="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white transition shadow-lg shadow-indigo-600/30">
          다시 시도
        </button>
      </div>

      <!-- Markdown Render Container -->
      <div id="report-content-body" class="markdown-report hidden"></div>
    </div>

    <!-- Bottom Bar -->
    <footer class="flex justify-between items-center py-3 text-xs text-slate-500">
      <a href="/" class="text-indigo-400 hover:text-indigo-300 transition">← 실시간 대시보드로 돌아가기</a>
      <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="hover:text-slate-300 transition">↑ 맨 위로 이동</button>
    </footer>

  </div>

  <script>
    (function() {
      'use strict';

      const state = {
        reportList: [],
        currentReportDate: '',
        currentReportData: null,
      };

      function formatFileSize(bytes) {
        if (!bytes || isNaN(bytes)) return '0 B';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function inlineFormat(text) {
        if (!text) return '';
        let s = escapeHtml(text);
        s = s.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
        s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        return s;
      }

      function renderMarkdownFallback(md) {
        if (!md) return '';
        const lines = md.split('\n');
        let html = '';
        let inTable = false;
        let inCodeBlock = false;
        let inList = false;

        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];

          if (line.trim().startsWith('```')) {
            if (!inCodeBlock) {
              inCodeBlock = true;
              html += '<pre><code>';
            } else {
              inCodeBlock = false;
              html += '</code></pre>\n';
            }
            continue;
          }
          if (inCodeBlock) {
            html += escapeHtml(line) + '\n';
            continue;
          }

          if (/^(\s*[-*_]\s*){3,}$/.test(line)) {
            if (inList) { html += '</ul>\n'; inList = false; }
            if (inTable) { html += '</tbody></table></div>\n'; inTable = false; }
            html += '<hr>\n';
            continue;
          }

          if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
            const cells = line.trim().slice(1, -1).split('|').map(c => c.trim());
            if (cells.every(c => /^:?-+:?$/.test(c))) continue;
            if (!inTable) {
              inTable = true;
              html += '<div class="table-container"><table><thead><tr>';
              cells.forEach(h => { html += `<th>${inlineFormat(h)}</th>`; });
              html += '</tr></thead><tbody>\n';
              continue;
            } else {
              html += '<tr>';
              cells.forEach(c => { html += `<td>${inlineFormat(c)}</td>`; });
              html += '</tr>\n';
              continue;
            }
          } else if (inTable) {
            inTable = false;
            html += '</tbody></table></div>\n';
          }

          if (/^\s*[-*]\s+/.test(line)) {
            if (!inList) { inList = true; html += '<ul>\n'; }
            const text = line.replace(/^\s*[-*]\s+/, '');
            html += `<li>${inlineFormat(text)}</li>\n`;
            continue;
          } else if (inList) {
            inList = false;
            html += '</ul>\n';
          }

          if (line.startsWith('# ')) { html += `<h1>${inlineFormat(line.slice(2))}</h1>\n`; continue; }
          if (line.startsWith('## ')) { html += `<h2>${inlineFormat(line.slice(3))}</h2>\n`; continue; }
          if (line.startsWith('### ')) { html += `<h3>${inlineFormat(line.slice(4))}</h3>\n`; continue; }
          if (line.startsWith('#### ')) { html += `<h4>${inlineFormat(line.slice(5))}</h4>\n`; continue; }
          if (line.startsWith('> ')) { html += `<blockquote>${inlineFormat(line.slice(2))}</blockquote>\n`; continue; }
          if (!line.trim()) continue;

          html += `<p>${inlineFormat(line)}</p>\n`;
        }

        if (inTable) html += '</tbody></table></div>\n';
        if (inList) html += '</ul>\n';
        if (inCodeBlock) html += '</code></pre>\n';
        return html;
      }

      function renderMarkdown(md) {
        if (!md) return '';
        if (window.marked && typeof window.marked.parse === 'function') {
          try {
            return window.marked.parse(md);
          } catch (e) {
            console.warn('Marked.js 파싱 실패, 내장 렌더러 전환:', e);
          }
        }
        return renderMarkdownFallback(md);
      }

      async function fetchReportList(selectDate) {
        try {
          const res = await fetch('/api/reports');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          state.reportList = data.reports || [];

          const selectEl = document.getElementById('report-date-select');
          if (selectEl) {
            selectEl.innerHTML = '';
            if (state.reportList.length === 0) {
              selectEl.innerHTML = '<option value="">등록된 일일 보고서가 없습니다</option>';
            } else {
              state.reportList.forEach((rep, idx) => {
                const opt = document.createElement('option');
                opt.value = rep.raw_date;
                opt.textContent = `${rep.date}${idx === 0 ? ' (최신)' : ''} [${formatFileSize(rep.size)}]`;
                selectEl.appendChild(opt);
              });
            }
          }

          let target = selectDate;
          if (!target && state.reportList.length > 0) {
            target = state.reportList[0].raw_date;
          }
          if (target) {
            loadReport(target);
          }
        } catch (err) {
          console.error('보고서 목록 로드 오류:', err);
          const errorEl = document.getElementById('report-error');
          const errorMsg = document.getElementById('report-error-msg');
          const loadingEl = document.getElementById('report-loading');
          if (loadingEl) loadingEl.classList.add('hidden');
          if (errorEl) errorEl.classList.remove('hidden');
          if (errorMsg) errorMsg.textContent = `보고서 목록을 가져오는 데 실패했습니다: ${err.message}`;
        }
      }

      async function loadReport(target) {
        const loadingEl = document.getElementById('report-loading');
        const errorEl = document.getElementById('report-error');
        const errorMsg = document.getElementById('report-error-msg');
        const bodyEl = document.getElementById('report-content-body');
        const selectEl = document.getElementById('report-date-select');
        const prevBtn = document.getElementById('report-prev-btn');
        const nextBtn = document.getElementById('report-next-btn');

        if (loadingEl) loadingEl.classList.remove('hidden');
        if (errorEl) errorEl.classList.add('hidden');
        if (bodyEl) bodyEl.classList.add('hidden');

        try {
          const param = target ? `?date=${encodeURIComponent(target)}` : '';
          const res = await fetch('/api/report' + param);
          const data = await res.json();

          if (!res.ok || !data.success) {
            throw new Error(data.message || `HTTP ${res.status}`);
          }

          state.currentReportData = data;
          state.currentReportDate = data.raw_date || target;

          if (selectEl && state.currentReportDate) {
            selectEl.value = state.currentReportDate;
          }

          const titleEl = document.getElementById('report-header-title');
          const dateEl = document.getElementById('report-meta-date');
          const filenameEl = document.getElementById('report-meta-filename');
          const sizeEl = document.getElementById('report-meta-size');
          const mtimeEl = document.getElementById('report-meta-mtime');

          if (titleEl) titleEl.textContent = data.title || '암호화폐 퀀트 매매 성과 분석 보고서';
          if (dateEl) dateEl.textContent = data.date || '-';
          if (filenameEl) {
            filenameEl.textContent = data.filename || '-';
            filenameEl.title = data.filename || '-';
          }
          if (sizeEl) sizeEl.textContent = formatFileSize(data.size);
          if (mtimeEl) {
            const d = data.mtime ? new Date(data.mtime * 1000) : new Date();
            mtimeEl.textContent = d.toLocaleString('ko-KR');
          }

          if (bodyEl) {
            const rawHtml = renderMarkdown(data.content);
            bodyEl.innerHTML = rawHtml;

            const tables = bodyEl.querySelectorAll('table');
            tables.forEach(tbl => {
              if (!tbl.parentElement.classList.contains('table-container')) {
                const wrapper = document.createElement('div');
                wrapper.className = 'table-container';
                tbl.parentNode.insertBefore(wrapper, tbl);
                wrapper.appendChild(tbl);
              }
            });

            bodyEl.classList.remove('hidden');
          }

          const currIdx = state.reportList.findIndex(r => r.raw_date === state.currentReportDate);
          if (currIdx !== -1) {
            if (prevBtn) prevBtn.disabled = (currIdx >= state.reportList.length - 1);
            if (nextBtn) nextBtn.disabled = (currIdx <= 0);
          }

          const newUrl = new URL(window.location);
          newUrl.searchParams.set('date', state.currentReportDate);
          history.replaceState(null, '', newUrl.toString());

        } catch (err) {
          console.error('보고서 로드 오류:', err);
          if (errorEl) errorEl.classList.remove('hidden');
          if (errorMsg) errorMsg.textContent = err.message || '보고서를 불러올 수 없습니다.';
        } finally {
          if (loadingEl) loadingEl.classList.add('hidden');
        }
      }

      window.onReportDateChange = (val) => loadReport(val);
      window.refreshCurrentReport = () => loadReport(state.currentReportDate);
      window.navigateReport = (delta) => {
        if (!state.reportList || state.reportList.length === 0) return;
        const currIdx = state.reportList.findIndex(r => r.raw_date === state.currentReportDate);
        if (currIdx === -1) return;
        const targetIdx = delta === -1 ? currIdx + 1 : currIdx - 1;
        if (targetIdx >= 0 && targetIdx < state.reportList.length) {
          loadReport(state.reportList[targetIdx].raw_date);
        }
      };
      window.copyReportMarkdown = () => {
        if (!state.currentReportData || !state.currentReportData.content) {
          alert('복사할 보고서 내용이 없습니다.');
          return;
        }
        navigator.clipboard.writeText(state.currentReportData.content)
          .then(() => alert('일일 퀀트 보고서 마크다운 원문이 클립보드에 복사되었습니다.'))
          .catch(() => alert('클립보드 복사에 실패했습니다.'));
      };
      window.downloadReportMarkdown = () => {
        if (!state.currentReportData || !state.currentReportData.content) {
          alert('다운로드할 보고서 데이터가 없습니다.');
          return;
        }
        const blob = new Blob([state.currentReportData.content], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = state.currentReportData.filename || 'daily_quant_report.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const initialDate = params.get('date') || '';
        fetchReportList(initialDate);
      });
    })();
  </script>
</body>
</html>
